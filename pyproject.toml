[project]
name = "business-manage"
version = "0.1.0"
description = ""
authors = [
    {name = "flashBNK",email = "lolmaks23@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "dependency-injector (>=4.49.1,<5.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.1,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pre-commit (>=4.6.1,<5.0.0)"
]
